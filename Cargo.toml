[workspace]
resolver = "2"
members = [
  "crates/needlbar-bridge",
  "crates/needlbar-project-analytics",
  "crates/needlbar-quota",
]
exclude = ["vendor/tokscale-core", ".worktrees"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "fs"] }
tokscale-core = { path = "vendor/tokscale-core" }
security-framework = "3.7.0"
security-framework-sys = "2.17.0"
core-foundation = "0.10"
core-foundation-sys = "0.8.7"
zeroize = "1.8"
libc = "0.2"

# Proc macros and build scripts run only on the build host. Rust before 1.98
# strips macOS release dylibs with rust-objcopy, which can misalign the
# __LINKEDIT string pool so macOS 27 dyld refuses to load the proc macro
# (rust-lang/rust#157750). Shipped target artifacts keep the default profile.
[profile.release.build-override]
strip = false
