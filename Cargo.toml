[workspace]
resolver = "2"
members = [
  "crates/needlbar-bridge",
  "crates/needlbar-source-sync",
  "crates/needlbar-quota",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "fs"] }
tokscale-core = { path = "vendor/tokscale-core" }
