name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  notarized-release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Select Swift 6 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.2.app
          xcodebuild -version
          swift --version

      - name: Package arm64 app before signing
        run: make package

      - name: Require stable-release signing and notarization secrets
        shell: bash
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            DEVELOPER_ID_APPLICATION
            DEVELOPER_ID_APPLICATION_CERTIFICATE
            DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD
            APPLE_ID
            APPLE_TEAM_ID
            APPLE_APP_SPECIFIC_PASSWORD
          )
          missing=()
          for secret_name in "${required[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              missing+=("$secret_name")
            fi
          done
          if [[ ${#missing[@]} -ne 0 ]]; then
            echo "::error::Refusing to publish an ad-hoc signed stable release. Configure: ${missing[*]}" >&2
            exit 1
          fi

      - name: Sign, notarize, staple, and repackage
        shell: bash
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          app_path="$root/dist/Needlbar.app"
          zip_path="$root/dist/Needlbar-macos-arm64.zip"
          keychain_path="$RUNNER_TEMP/needlbar-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/needlbar-developer-id.p12"
          keychain_password="$(uuidgen)"
          original_keychains=()
          while IFS= read -r keychain; do
            original_keychains+=("$keychain")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"(.*)"$/\1/')

          cleanup() {
            status=$?
            trap - EXIT
            if [[ ${#original_keychains[@]} -gt 0 ]]; then
              security list-keychains -d user -s "${original_keychains[@]}" >/dev/null 2>&1 || true
            fi
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f -- "$certificate_path"
            exit "$status"
          }
          trap cleanup EXIT

          printf '%s' "$DEVELOPER_ID_APPLICATION_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "${original_keychains[@]}"
          security find-identity -v -p codesigning "$keychain_path"

          codesign --force --deep --options runtime --timestamp --sign "$DEVELOPER_ID_APPLICATION" "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          rm -f -- "$zip_path"
          (
            cd "$root/dist"
            COPYFILE_DISABLE=1 /usr/bin/zip -qryX "$zip_path" "Needlbar.app"
          )
          xcrun notarytool submit "$zip_path" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          rm -f -- "$zip_path"
          (
            cd "$root/dist"
            COPYFILE_DISABLE=1 /usr/bin/zip -qryX "$zip_path" "Needlbar.app"
          )

      - name: Publish notarized GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Needlbar-macos-arm64.zip
