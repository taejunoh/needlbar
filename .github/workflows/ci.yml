name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Install Rust if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Verify Rust toolchain
        shell: bash
        run: |
          cargo --version
          rustc --version

      - name: Select Swift 6 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_16.2.app
          xcodebuild -version
          swift --version

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Test vendored tokscale-core
        run: cargo test --manifest-path vendor/tokscale-core/Cargo.toml

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Lint vendored tokscale-core
        run: cargo clippy --manifest-path vendor/tokscale-core/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test complete project
        run: make test

      - name: Package arm64 app
        run: make package

      - name: Regression-test smoke cleanup
        run: ./scripts/tests/smoke-app-tests.sh

      - name: Smoke-test packaged app
        run: ./scripts/smoke-app.sh

      - name: Upload arm64 app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Needlbar-macos-arm64
          path: dist/Needlbar-macos-arm64.zip
          if-no-files-found: error
