[package]
name = "needlbar-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
bridge-test-runtime = ["dep:async-trait"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokscale-core.workspace = true
needlbar-quota = { path = "../needlbar-quota" }
needlbar-project-analytics = { path = "../needlbar-project-analytics" }
libc = "0.2"
async-trait = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true

[[test]]
name = "redaction_contract"
required-features = ["bridge-test-runtime"]
